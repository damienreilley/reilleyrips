<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>My Pulls - 2026 Stars &amp; Stripes Prizm</title>
<style>
:root{--bg:#f4ecd8;--surface:#fffaf0;--surface2:#f0e6cf;--fg:#2a1a12;--muted:#7a6a55;--accent:#8b1a1a;--ok:#2e8b40;--border:#ddcdaa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:14px}
.back{display:inline-block;margin:4px 0 12px;padding:9px 16px;background:var(--accent);color:#fff;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px}
h1{font:800 24px/1.2 Georgia,serif;color:var(--accent);margin:2px 0}
.sub{color:var(--muted);margin:0 0 12px;font-size:14px}
.prog{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.pcount{font:800 22px/1 inherit;color:var(--accent)}
.bar{height:12px;background:var(--surface2);border-radius:8px;overflow:hidden;margin-top:8px}
.fill{height:100%;background:var(--ok);width:0%;transition:width .2s}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tools input{flex:1;min-width:160px;padding:10px 12px;border:2px solid var(--border);border-radius:10px;font:600 15px inherit;background:#fff}
.btn{padding:10px 14px;border:2px solid var(--border);border-radius:10px;background:var(--surface);font:700 13px inherit;color:var(--fg);cursor:pointer}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer}
li:last-child{border-bottom:none}
li.got{background:#eaf6ec}
.chk{width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
li.got .chk{background:var(--ok);border-color:var(--ok)}
.num{font:700 13px ui-monospace,monospace;color:var(--muted);width:34px;flex:0 0 auto}
.nm{font-weight:700}
.tm{color:var(--muted);font-size:13px}
.foot{text-align:center;padding:16px 0;font-size:12px;color:var(--muted)}.foot a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">&larr; Back to Card Finder</a>
<h1>My Pulls</h1>
<p class="sub">2026 Stars &amp; Stripes Prizm &middot; base set (200). Tap a card to mark it pulled. Saved on this device.</p>

<div class="prog"><span class="pcount" id="pcount">0 / 200</span> <span id="ppct" style="color:var(--muted)"></span>
<div class="bar"><div class="fill" id="fill"></div></div></div>

<div class="tools">
<input id="search" type="search" placeholder="Find by number, name or team" autocomplete="off">
<button class="btn" id="showGot">Show pulled</button>
<button class="btn acc" id="csv">Export CSV</button>
<button class="btn" id="reset">Clear</button>
</div>

<ul id="list"><li>Loading the checklist&hellip;</li></ul>

<div class="foot">
Saved only on this device/browser. <a href="index.html">Card Finder</a> &middot; <a href="checklist.html">Checklist</a> &middot; <a href="box-comparison.html">Box Breakdown</a>
</div>
</div>

<script>
(function(){
  var KEY='reilleyrips_pulls_stars-stripes_base';
  var cards=[], got=load(), onlyGot=false, q='';
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){return {};}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(got));}catch(e){}}
  function $(i){return document.getElementById(i);}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  function render(){
    var ql=q.toLowerCase().trim();
    var rows=cards.filter(function(c){
      if(onlyGot && !got[c.n]) return false;
      if(!ql) return true;
      return (c.n+' '+c.a+' '+(c.t||'')).toLowerCase().indexOf(ql)>=0;
    });
    var html=rows.map(function(c){
      var on=!!got[c.n];
      return '<li class="'+(on?'got':'')+'" data-n="'+c.n+'"><span class="chk">'+(on?'✓':'')+'</span>'
        +'<span class="num">#'+c.n+'</span>'
        +'<span><span class="nm">'+esc(c.a)+'</span><br><span class="tm">'+esc(c.t||'')+'</span></span></li>';
    }).join('');
    $('list').innerHTML = html || '<li>No cards match.</li>';
    var n=cards.reduce(function(a,c){return a+(got[c.n]?1:0);},0);
    $('pcount').textContent=n+' / '+cards.length;
    var pct=cards.length?Math.round(n/cards.length*100):0;
    $('ppct').textContent='('+pct+'%)';
    $('fill').style.width=pct+'%';
  }

  $('list').addEventListener('click',function(e){
    var li=e.target.closest('li'); if(!li||!li.dataset.n) return;
    var n=li.dataset.n;
    if(got[n]) delete got[n]; else got[n]=1;
    save(); render();
  });
  $('search').addEventListener('input',function(e){q=e.target.value;render();});
  $('showGot').addEventListener('click',function(){onlyGot=!onlyGot;this.classList.toggle('acc',onlyGot);this.textContent=onlyGot?'Show all':'Show pulled';render();});
  $('reset').addEventListener('click',function(){if(confirm('Clear all pulled marks for the base set?')){got={};save();render();}});
  $('csv').addEventListener('click',function(){
    var owned=cards.filter(function(c){return got[c.n];});
    var lines=['Set,Card Number,Player,Team'];
    owned.forEach(function(c){lines.push(['2026 Stars & Stripes Prizm',c.n,'"'+String(c.a).replace(/"/g,'""')+'"','"'+String(c.t||'').replace(/"/g,'""')+'"'].join(','));});
    var blob=new Blob([lines.join('\n')],{type:'text/csv'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-pulls-stars-stripes-base.csv';document.body.appendChild(a);a.click();a.remove();
  });

  fetch('data/stars-stripes.json?v='+Date.now()).then(function(r){return r.json();}).then(function(d){
    var fam=(d.families||[]).filter(function(f){return f.type==='Base';});
    fam.forEach(function(f){(f.cards||[]).forEach(function(c){cards.push({n:c.n,a:c.a,t:c.t});});});
    cards.sort(function(a,b){return a.n-b.n;});
    render();
  }).catch(function(){ $('list').innerHTML='<li>Could not load the checklist. Refresh to try again.</li>'; });
})();
</script>
</body>
</html>
